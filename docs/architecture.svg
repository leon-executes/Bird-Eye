<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 10 5-10 5" fill="#91abc4"/></marker><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#dce5ee}.k{font-size:13px;letter-spacing:2px;fill:#d4b88c}.t{font-size:22px;font-weight:600}.s{font-size:16px;fill:#9fb4ca}.b{fill:#152336;stroke:#354b66;stroke-width:1.5}.f{fill:none;stroke:#91abc4;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1440" height="1080" rx="16" fill="#0c1420"/><text class="k" x="54" y="49">BIRD EYE / EXECUTION &amp; EVIDENCE</text><text class="t" x="54" y="87">One task. Labelled views. Inspectable judgment.</text>
<rect class="b" x="54" y="123" width="1332" height="113" rx="9"/><text class="k" x="78" y="153">01 / DESKTOP &amp; IMPORT</text><text class="t" x="78" y="187">Single · Bulk individual · Bulk grouped folders</text><text class="s" x="78" y="215">1–4 views per task · explicit modalities · original bytes and hashes retained · complete grouping preview</text>
<path class="f" d="M720 236v35"/>
<rect class="b" x="54" y="279" width="1332" height="105" rx="9"/><text class="k" x="78" y="309">02 / LOCAL CONTROL &amp; INSPECTION</text><text class="t" x="78" y="342">Sequential queue + deterministic product measurements</text><text class="s" x="78" y="369">Checkpoint tasks · validate metadata · apply QA masks · preserve scale limits · keep references out of inference</text>
<path class="f" d="M720 384v35"/><path class="f" d="M720 404H270v15"/><path class="f" d="M720 404h450v15"/>
<rect class="b" x="54" y="428" width="414" height="220" rx="9"/><text class="k" x="78" y="460">03A / SATELLITE FIRST READING</text><text class="t" x="78" y="499">EarthDial 4B RGB</text><text class="s" x="78" y="534">Scene content and spatial arrangement</text><text class="s" x="78" y="565">RemoteCLIP: competing RGB labels</text><text class="s" x="78" y="603">RGB scope · caption proposals</text><text class="s" x="78" y="628">No thermal authority inferred</text>
<rect class="b" x="513" y="428" width="414" height="220" rx="9"/><text class="k" x="537" y="460">03B / APPLICABLE OBSERVERS</text><text class="t" x="537" y="499">CapRL + general reasoning</text><text class="s" x="537" y="534">Independent RGB caption proposal</text><text class="s" x="537" y="565">Labelled IR / NIR / SAR companions</text><text class="s" x="537" y="603">Observed facts and alternatives</text><text class="s" x="537" y="628">Roles do not certify expertise</text>
<rect class="b" x="972" y="428" width="414" height="220" rx="9"/><text class="k" x="996" y="460">03C / NARROW HELPERS</text><text class="t" x="996" y="499">Thermal object proposals</text><text class="s" x="996" y="534">Declared aerial thermal inputs only</text><text class="s" x="996" y="565">Boxes / classes remain reviewable</text><text class="s" x="996" y="603">No geothermal-cause diagnosis</text><text class="s" x="996" y="628">Optional CPU ONNX inference</text>
<path class="f" d="M270 648v25h450v25"/><path class="f" d="M720 648v50"/><path class="f" d="M1170 648v25H720"/>
<rect class="b" x="54" y="708" width="1332" height="129" rx="9"/><text class="k" x="78" y="740">04 / CHALLENGE → CLAIM LEDGER → FINAL ASSESSMENT</text><text class="t" x="78" y="777">Retain · Qualify · Reject · Disclose incomplete coverage</text><text class="s" x="78" y="811">Qwen3.5 structured review · source confidence caps · numeric evidence guards · dissent retained when different</text>
<path class="f" d="M720 837v34"/>
<rect x="54" y="881" width="1332" height="136" rx="9" fill="#1d2b3a" stroke="#9b825f"/><text class="k" x="78" y="914">05 / HUMAN-READABLE OUTPUT</text><text class="t" x="78" y="953">Caption + evidence grades + measurements + actual model receipt</text><text class="s" x="78" y="987">JSON / Markdown · checkpointed batches · human review retained separately · qualitative confidence, not probabilities</text>
<text class="s" x="54" y="1052">Branches are logical roles. Heavy local models execute in turns; repeated models are correlated evidence.</text></svg>

